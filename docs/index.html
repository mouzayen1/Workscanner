 et al.)", "url": "https://jobs.uhsinc.com/careers-home/jobs/348889?lang=en-us", "location_raw": "MURRIETA, California", "city": "MURRIETA", "state": "CA", "latitude": null, "longitude": null, "description": "Responsibilities Southwest Healthcare Inland Valley Hospital in Wildomar, California, is a licensed 122-bed facility accredited by the Joint Commission. It is Southwest Riverside County's only designated Trauma Center and a county-designated Paramedic Base Station. The hospital performs more than 4,000 surgeries a year, and has an average of 4,000 Emergency Department visits per month. The hospital features a Bariatric Weight-Loss Surgery Center of Excellence and the region\u2019s only Total Joint Center. Southwest Healthcare Rancho Springs Hospital in Murrieta, California, is a 120 bed acute-care hospital with the region's only Pediatric Emergency Services team (for children 14 and under) provid\u2026", "salary_raw": "", "posted_at": "2026-04-09T22:53:00+0000", "category": "hospital-other", "score": 23, "tags": ["hospital"], "location_tier": 2, "first_seen": "2026-07-31T23:57:02Z", "last_seen": "2026-09-01T01:57:24Z", "active": true, "key": "ceed7fd4a4c4415b"}], "health": {"radnet": "ok (68 raw)", "simonmed": "ok (241 raw)", "hoag": "skipped (disabled in config)", "memorialcare": "ok (20 raw)", "cityofhope": "ok (7 raw)", "providence": "ok (41 raw)", "kaiser": "ok (89 raw)", "pih": "ok (12 raw)", "uhs": "ok (18 raw)", "prime": "skipped (disabled in config)", "uci": "skipped (disabled in config)", "snmmi": "skipped (disabled in config)", "asrt": "skipped (disabled in config)", "vivian": "ok (20 raw)", "aya": "ok (10 raw)", "adzuna": "ok (53 raw)", "jsearch": "ok (22 raw)", "jooble": "skipped (no API key configured)", "usajobs": "skipped (no API key configured)"}, "categories": ["outpatient-pet", "outpatient-nm", "hospital-other", "travel"], "labels": {"outpatient-pet": "Outpatient PET/CT", "outpatient-nm": "Outpatient Nuclear Med", "hospital-other": "Hospital / <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const state = { cat: 'outpatient-pet', q: '', sort: 'score' };
const NEW_MS = 1000 * 60 * 60 * 48;

function isNew(j) {
  const t = Date.parse(j.first_seen || 0);
  return t && (Date.now() - t) < NEW_MS;
}
function counts() {
  const c = {};
  for (const j of DATA.jobs) c[j.category] = (c[j.category] || 0) + 1;
  return c;
}
function renderTabs() {
  const c = counts();
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  const cats = ['outpatient-pet','outpatient-nm','hospital-other','travel'];
  for (const cat of cats) {
    const b = document.createElement('button');
    b.textContent = `${DATA.labels[cat]} (${c[cat] || 0})`;
    b.className = state.cat === cat ? 'on' : '';
    b.onclick = () => { state.cat = cat; render(); };
    el.appendChild(b);
  }
  const all = document.createElement('button');
  all.textContent = `All (${DATA.jobs.length})`;
  all.className = state.cat === 'all' ? 'on' : '';
  all.onclick = () => { state.cat = 'all'; render(); };
  el.appendChild(all);
}
function render() {
  renderTabs();
  const q = state.q.toLowerCase();
  let jobs = DATA.jobs.filter(j => state.cat === 'all' || j.category === state.cat);
  if (q) jobs = jobs.filter(j =>
    (j.title + ' ' + j.company + ' ' + (j.location_raw||'') + ' ' + (j.tags||[]).join(' '))
      .toLowerCase().includes(q));
  jobs.sort((a, b) => state.sort === 'new'
    ? (Date.parse(b.first_seen||0)||0) - (Date.parse(a.first_seen||0)||0)
    : (b.score||0) - (a.score||0));
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">No listings in this category right now.</div>';
    return;
  }
  for (const j of jobs) {
    const card = document.createElement('div');
    card.className = 'card';
    const chips = [];
    if (isNew(j)) chips.push('<span class="chip new">NEW</span>');
    for (const t of (j.tags || [])) chips.push(`<span class="chip">${esc(t)}</span>`);
    chips.push(`<span class="chip score">score ${j.score||0}</span>`);
    const first = (j.first_seen || '').slice(0, 10);
    card.innerHTML = `
      <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="meta">${esc(j.company)} · ${esc(j.location_raw || 'location unknown')}
        ${j.salary_raw ? ' · ' + esc(j.salary_raw) : ''}${first ? ' · first seen ' + first : ''}</div>
      <div class="chips">${chips.join('')}</div>`;
    list.appendChild(card);
  }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g,
  m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.getElementById('updated').textContent =
  'Updated ' + (DATA.updated ? new Date(DATA.updated).toLocaleString() : 'never') +
  ' · ' + DATA.jobs.length + ' active listings';
const ht = document.getElementById('health');
for (const [src, st] of Object.entries(DATA.health || {})) {
  ht.innerHTML += `<tr><td>${esc(src)}</td><td>${esc(st)}</td></tr>`;
}
const noKey = Object.entries(DATA.health || {})
  .filter(([, st]) => st.includes('no API key')).map(([src]) => src);
if (noKey.length) {
  const wb = document.getElementById('warnbar');
  wb.style.display = 'block';
  wb.textContent = '⚠️ ' + noKey.join(', ') + ' switched off (no API key) — '
    + 'Indeed/Google-only postings such as small doctor-office jobs are NOT '
    + 'being scanned. Fix: README → "add 2 free API keys".';
}
render();
</script>
